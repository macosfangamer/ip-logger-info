services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-mfg_network_diagnostics}
      MYSQL_USER: ${DB_USER:-mfg}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-me}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-mfg_network_diagnostics}
      DB_USER: ${DB_USER:-mfg}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-replace-this-secret}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:
